name: Deploy Realtime Stockbit Integration

on:
  push:
    branches:
      - main
    paths:
      - 'data/fetcher_stockbit.py'
      - 'web-backend/main.py'
      - 'agents/portfolio_advisor.py'
      - 'web-frontend/src/app/(app)/ihsg/**'
      - 'web-frontend/src/app/(app)/portfolio/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Verify Python syntax
        run: |
          python3 -c "
          import ast
          files = [
              'data/fetcher_stockbit.py',
              'web-backend/main.py',
              'agents/portfolio_advisor.py'
          ]
          for f in files:
              try:
                  with open(f) as file:
                      ast.parse(file.read())
                  print(f'✅ {f}')
              except SyntaxError as e:
                  print(f'❌ {f}: {e}')
                  exit(1)
          "

      - name: Run tests
        run: |
          pip install python-dotenv httpx pandas numpy
          python3 test_realtime_integration.py

      - name: Notify Slack (Success)
        if: success()
        run: |
          echo "✅ Deployment successful - Realtime Stockbit integration deployed"

      - name: Notify Slack (Failure)
        if: failure()
        run: |
          echo "❌ Deployment failed - Check logs"
